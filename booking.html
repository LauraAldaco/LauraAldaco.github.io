<!DOCTYPE html>
<html lang="en">
<head>
    <title>The Pink Spot - Buckeye, AZ</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pinkspot.css">
</head>
<body>
    <div id="wrapper">
        <header>
            <div id="location">Buckeye, AZ</div>
            <h1>The Pink Spot</h1>
            <p class="tagline">Looking for maintenance, make just one stop!</p>
        </header>

         <nav>
             <ul>
        
                <li><a href="index.html">Home</a></li>
                <li><a href="nails.html">Nails</a></li>
                <li><a href="bouquets.html">Bouquets</a></li>
                <li><a href="facials&waxing.html">Facials & Waxing</a></li>
                <li><a href="booking.html" class="active">Book Now!</a> </li>
             </ul>
          </nav>

          <main>

            <section id="booking-section">
                <h2>Book with your Pink Spot Tech Today!</h2>
                <p class="required-note">Required fields are marked*</p>

                <form method="post" action="#">
                    <label for="fname">1st Name*</label>
                    <input type="text" id="fname" name="fname" required>

                    <label for="lname">Last Name*</label>
                    <input type="text" id="lname" name="lname" required>

                    <label for="phone">Phone #*</label>
                    <input type="tel" id="phone" name="phone" required>

                    <label for="instagram">Instagram@</label>
                    <input type="text" id="insta" name="insta">

                    <label for="tiktok">TikTok@</label>
                    <input type="text" id="tiktok" name="tiktok">

                    <label for="date">Date requested*</label>
                    <input type="date" id="date" name="date" required>

                    <label for="comments">Comments/Requests</label>
                    <textarea id="comments" name="comments" rows="3"></textarea>

                    <input type="submit" value="Submit" id="mySubmit">
                </form>
            </section>
        </main>

        <footer>
            <div id="footer-logo">PS</div>
            <small>
                <i>
                    Copyright &copy; 2026 The Pink Spot<br>
                    <a href="mailto:thepinkspot@gmail.com">thepinkspot@gmail.com</a>
                </i>
            </small>
        </footer>
    </div>
</body>
</html>
